services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ikhana_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./setup.sh:/usr/local/bin/setup.sh:ro
    networks:
      - ikhana_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: ikhana_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ikhana_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: ikhana_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ikhana}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-ikhana}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - ikhana_network

networks:
  ikhana_network:
    driver: bridge

volumes:
  dbdata:
    driver: local

