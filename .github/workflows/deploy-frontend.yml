name: Deploy Angular Frontend

on:
  push:
    tags:
      - 'v*.*.*' # Se dispara solo cuando creas un tag como v1.0.0, v2.1.3, etc.

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Compilar Angular para producción
        run: npm run build --configuration=production
        working-directory: frontend

      - name: Limpiar carpeta anterior en el VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/kikhana/frontend/*

      - name: Desplegar al VPS vía SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/kikhana-web/browser/*"
          target: "/var/www/kikhana/frontend/"
          strip_components: 4

      - name: Ajustar permisos en el VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chown -R www-data:www-data /var/www/kikhana/frontend
            chmod -R 755 /var/www/kikhana/frontend
