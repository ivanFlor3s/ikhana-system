name: Deploy Angular Frontend

on:
  push:
    tags:
      - 'v*.*.*' # Se dispara solo cuando creas un tag como v1.0.0, v2.1.3, etc.

  # 2. Disparador Manual (El "Pro-Tip")
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24' # Ajusta a la versión que uses

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular para producción
        run: npm run build --configuration=production
      - name: Limpiar carpeta anterior en el VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /var/www/kikhana/frontend/*
      - name: Desplegar al VPS vía SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/kikhana-web/browser/*" # Ajusta la ruta exacta de tu dist
          target: "/var/www/kikhana/frontend/"
          strip_components: 3 # Esto quita las carpetas "dist/nombre/browser" y deja solo los archivos

      - name: Ajustar permisos en el VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chown -R www-data:www-data /var/www/kikhana/frontend
            chmod -R 755 /var/www/kikhana/frontend
