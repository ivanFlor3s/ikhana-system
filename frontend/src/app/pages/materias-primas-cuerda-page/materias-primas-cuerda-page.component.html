<div class="flex flex-col h-full gap-2 p-4">
    <app-mp-cobre-header (onNuevoIngreso)="onNuevoIngreso()" />
    <app-mp-cobre-filter (filterChange)="onFilterChange($event)" />
    @if (isLoading()) {
        <div class="flex justify-center items-center h-full">
            <mat-spinner [diameter]="40" />
        </div>
    } @else {
        <app-mp-stock-cobre-list [data]="data()" materialPath="cuerda" />
    }
</div>
