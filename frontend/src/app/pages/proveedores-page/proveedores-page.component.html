<app-proveedores-header class="mb-10" (createClicked)="openProviderDialog()"></app-proveedores-header>

<div class="flex flex-col gap-4 p-4">
    <app-proveedores-filter [rubros]="categories()" (filterChange)="onFilterChange($event)">
    </app-proveedores-filter>

    @if (isLoading()) {
    <div class="flex justify-center items-center py-20">
        <mat-spinner></mat-spinner>
    </div>
    } @else {
    <app-proveedores-list [providers]="providers()" (providerDeleted)="onProviderDeleted()"></app-proveedores-list>

    }
</div>
