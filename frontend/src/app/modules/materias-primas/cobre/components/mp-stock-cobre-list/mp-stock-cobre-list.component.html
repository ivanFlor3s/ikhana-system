<app-table [data]="data()" [columns]="columns">
    <!-- Custom renderer for 'actions' column -->
    <ng-template modernTableCell="actions" let-row>
        <div class="flex gap-2 items-center">
            <lucide-angular matTooltip="Editar" (click)="onEdit(row, $event)" [img]="pencilIcon" size="16">
            </lucide-angular>
            <lucide-angular matTooltip="Ver detalle" (click)="onDetail(row, $event)" [img]="eyeIcon" size="16">
            </lucide-angular>
            <lucide-angular matTooltip="Imprimir ticket entrada" (click)="onDownloadLabel(row, $event)" [img]="tagIcon"
                size="16">
            </lucide-angular>
            <lucide-angular matTooltip="Reporte de ensayo" (click)="onDownloadTestReport(row, $event)"
                [img]="flaskConicalIcon" size="16">
            </lucide-angular>
        </div>
    </ng-template>
</app-table>
