<form [formGroup]="forma" class="flex flex-col  md:flex-row gap-4">
    <div class=" grid grid-cols-4 items-center gap-4">
        <app-input class="col-span-4" [hasPrefix]="true" placeholder="Buscar proveedor" formControlName="name"
            size="md">
            <ng-container prefix>
                <span class="text-gray-500 h-full flex items-center">
                    <mat-icon matPrefix>search</mat-icon>
                </span>
            </ng-container>
        </app-input>

    </div>

    <app-custom-select [options]="rubros" size="sm" [multiple]="false" placeholder="Filtrar por rubros"
        formControlName="rubros" />
</form>
