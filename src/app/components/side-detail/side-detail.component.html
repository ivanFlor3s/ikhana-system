<!-- Side detail panel -->

<div class="fixed inset-0 z-50 flex justify-end" [class.pointer-events-none]="!isOpen()"
    [class.pointer-events-auto]="isOpen()">

    <div class="absolute inset-0 bg-black/50 transition-opacity duration-300 ease-in-out" [class.opacity-0]="!isOpen()"
        [class.opacity-100]="isOpen()" (click)="close()"></div>

    <div class="relative w-1/3 h-full bg-white shadow-2xl transform transition-transform duration-300 ease-in-out"
        [class.translate-x-full]="!isOpen()" [class.translate-x-0]="isOpen()">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800">Menú</h2>
            <button (click)="close()" class="text-gray-500 hover:text-red-500">
                ✕
            </button>
        </div>

        <div class="p-4">
            <ng-container #dynamicComponentContainer></ng-container>
        </div>
    </div>

</div>
