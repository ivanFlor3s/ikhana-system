<app-page-header [title]="providerName() ? ('Movimientos de Bobinas - ' + providerName()) : 'Movimientos de Bobinas'">
    <ng-container icon>
        <div class="bg-teal-500 text-white w-15  flex items-center justify-center ">
            <lucide-angular [img]="arrowIcon"></lucide-angular>
        </div>
    </ng-container>
</app-page-header>

<div class="flex flex-col gap-4 p-4">
    @if (isLoading()) {
    <div class="flex justify-center items-center py-20">
        <mat-spinner></mat-spinner>
    </div>
    } @else {
    <app-table [columns]="columns" [data]="movements()" [initialPageSize]="20" [pageSizeOptions]="[10, 20, 50]"
        (pageChanged)="onPageChanged($event)">
    </app-table>
    }
</div>
