<app-rubros-header class="mb-10" (createClicked)="openRubroDialog()"></app-rubros-header>

<div class="flex flex-col gap-4 p-4">

    @if (isLoading()) {
    <div class="flex justify-center items-center py-20">
        <mat-spinner></mat-spinner>
    </div>
    } @else {
    <app-rubros-list [rubros]="rubros()" (rubroDeleted)="onRubroDeleted()"></app-rubros-list>
    }

</div>
