<form [formGroup]="loginForm" class="flex flex-col items-center justify-center gap-y-5">
    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Ex. user@example.com" formControlName="email" />
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">El email es requerido</mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">El email es invalido</mat-error>
    </mat-form-field>

    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" placeholder="Ex. ********" formControlName="password" />
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es requerida</mat-error>
    </mat-form-field>



    <app-button class="w-full" [isBlock]="true" appearance="primary"> Iniciar sesión </app-button>
</form>
