<app-mp-cobre-header (onNuevoIngreso)="onNuevoIngreso()"></app-mp-cobre-header>

<div class="flex flex-col gap-4 p-4">
    <!-- Filter Component -->
    <app-mp-cobre-filter (filterChange)="onFilterChange($event)"></app-mp-cobre-filter>

    @if (isLoading()) {
    <div class="flex justify-center items-center py-20">
        <mat-spinner></mat-spinner>
    </div>
    } @else {
    <app-mp-stock-cobre-list [data]="data()"></app-mp-stock-cobre-list>
    }
</div>
