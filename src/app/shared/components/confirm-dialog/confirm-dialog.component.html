<h2 mat-dialog-title class="text-xl font-semibold text-neutral-900 mb-2">
    {{ data.title }}
</h2>

<mat-dialog-content class="text-neutral-700 mb-6">
    <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions class="flex justify-end gap-3 mt-6">
    <button mat-button (click)="onCancel()" [disabled]="isLoading"
        class="px-4 py-2 text-neutral-600 hover:bg-neutral-100 rounded-lg transition-colors">
        {{ data.cancelText }}
    </button>

    <button mat-flat-button (click)="onConfirm()" [disabled]="isLoading"
        class="px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded-lg transition-colors flex items-center gap-2">
        @if (isLoading) {
        <mat-spinner diameter="20" class="inline-block"></mat-spinner>
        }
        <span>{{ data.confirmText }}</span>
    </button>
</mat-dialog-actions>
