<h2 mat-dialog-title>{{ dialogTitle }}</h2>

<mat-dialog-content>
    <!-- Loading State -->
    <div *ngIf="isLoading()" class="flex justify-center items-center py-8">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- Form -->
    <form [formGroup]="form" *ngIf="!isLoading()" class="flex flex-col gap-4 py-4">
        <!-- Error Message -->
        <div *ngIf="errorMessage()" class="bg-red-50 border border-red-200 rounded-lg p-3 mb-2">
            <p class="text-sm text-red-700">{{ errorMessage() }}</p>
        </div>

        <!-- Name Field -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" placeholder="Ej: Construcción" required>
            <mat-error *ngIf="form.get('name')?.hasError('required')">
                El nombre es requerido
            </mat-error>
        </mat-form-field>

        <!-- Description Field -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Descripción</mat-label>
            <textarea matInput formControlName="description" placeholder="Descripción del rubro (opcional)"
                rows="4"></textarea>
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="gap-2 p-4">
    <app-button appearance="secondary" variant="outlined" size="md" (click)="onNoClick()" [disabled]="isSubmitting()">
        Cancelar
    </app-button>
    <app-button appearance="primary" variant="solid" size="md" (click)="submit()"
        [disabled]="isSubmitting() || isLoading()">
        <span *ngIf="!isSubmitting()">{{ isEditMode ? 'Actualizar' : 'Crear' }}</span>
        <span *ngIf="isSubmitting()" class="flex items-center gap-2">
            <mat-spinner diameter="16" color="accent"></mat-spinner>
            {{ isEditMode ? 'Actualizando...' : 'Creando...' }}
        </span>
    </app-button>
</mat-dialog-actions>
