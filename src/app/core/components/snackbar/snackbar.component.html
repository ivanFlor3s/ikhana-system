<div class="flex items-start gap-3 p-4 rounded-lg shadow-lg min-w-80 max-w-[500px] border animate-[slideInDown_0.3s_ease-out]"
    [ngClass]="{
    'bg-emerald-500 text-white border-emerald-600': notification.type === 'success',
    'bg-amber-50 text-amber-900 border-amber-400': notification.type === 'warning',
    'bg-indigo-500 text-white border-indigo-600': notification.type === 'info',
    'bg-red-500 text-white border-red-600': notification.type === 'error'
  }">
    <div class="flex items-start gap-3 flex-1">
        <div class="flex items-center justify-center shrink-0">
            <mat-icon class="text-2xl w-6 h-6" [ngClass]="{
          'text-white': notification.type === 'success' || notification.type === 'info' || notification.type === 'error',
          'text-amber-500': notification.type === 'warning'
        }">{{ notification.icon }}</mat-icon>
        </div>
        <div class="flex-1 min-w-0">
            <div class="font-semibold text-sm leading-5 mb-0.5">{{ notification.title }}</div>
            <div class="text-[13px] leading-[18px] opacity-90" *ngIf="notification.description">
                {{ notification.description }}
            </div>
        </div>
    </div>
    <button *ngIf="notification.dismissible" mat-icon-button class="-m-2 -mt-2 shrink-0" [ngClass]="{
      'text-white': notification.type === 'success' || notification.type === 'info' || notification.type === 'error',
      'text-amber-900': notification.type === 'warning'
    }" (click)="onDismiss()" aria-label="Dismiss notification">
        <mat-icon class="text-[20px] w-5 h-5">close</mat-icon>
    </button>
</div>
